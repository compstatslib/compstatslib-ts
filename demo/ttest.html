<!-- A fragment. demo/main.ts fetches it and puts it in #demo. -->
<h2>Interactive t test</h2>

<p>
  Move the sliders to change the test. The null curve is red, the alternative
  curve is blue, and the shaded areas show alpha and power. The Error Matrix
  box adds the four possible outcomes. This is
  <code>interactive_t_test()</code> from the R package.
</p>

<!--
  Wide on purpose. The error matrix sits in the left sixth of the world
  window, so the room its captions get grows with the width of the picture.
-->
<div
  id="ttest-container"
  style="
    width: 960px;
    max-width: 100%;
    height: 520px;
    border: 1px solid #cccccc;
  "
></div>

<p>
  <button type="button" id="ttest-done">Done</button>
</p>
