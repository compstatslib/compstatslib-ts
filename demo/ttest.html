<h2>Interactive t test</h2>

<p>
  Move the sliders to change the test. The null curve is red, the alternative
  curve is blue, and the shaded areas show alpha and power. The Error Matrix
  box adds the four possible outcomes. This is
  <code>interactive_t_test()</code> from the R package.
</p>

</p>
