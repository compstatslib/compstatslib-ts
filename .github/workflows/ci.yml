name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Pinned rather than latest: CLAUDE.md records bundler behavior that is
      # specific to this version, and the build below is what publishes.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      # The published artifact. A build failure must not wait for a publish.
      - name: Build
        run: bun run build
