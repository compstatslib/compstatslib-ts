# Publish a tagged version to npm through trusted publishing (OIDC).
#
# No token is stored anywhere. npm trusts this repository and this workflow
# file by name, and mints a short-lived credential for the run, so the publish
# also carries a provenance attestation.
#
# The trusted publisher must already exist on npmjs.com for @compstats/core,
# naming repository `compstatslib/compstatslib-ts` and workflow `release.yml`.
# Renaming this file breaks the publish until the setting is updated to match.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    # The OIDC handshake. Without it npm sees no identity and asks for a token.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      # The toolchain, pinned to the version CI builds with.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # npm does the publish, because `bun publish` does not speak OIDC.
      # Trusted publishing needs npm 11.5.1 or later on Node 22.14 or later;
      # the runner's bundled npm is usually older, so it is upgraded here.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm install --global npm@latest

      - run: bun install --frozen-lockfile

      # A tag that disagrees with the manifest would publish the wrong number
      # under the right name, which no later tag can take back.
      - name: The tag names the version being published
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(bun --print 'require("./package.json").version')"
          if [ "$tagged" != "$declared" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json $declared" >&2
            exit 1
          fi

      # `prepublishOnly` runs the tests, the typecheck and the build first, so
      # what ships is built here rather than uploaded from a working copy.
      - name: Publish
        run: npm publish --access public
